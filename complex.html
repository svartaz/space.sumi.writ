<html>
  <head>
    <style>
      body {
        display: grid;
        gap: 1em;
        grid-template-columns: 1fr 1fr;
        place-items: center;
        padding: 1em;
        inline-size: fit-content;
        block-size: fit-content;
        margin: auto;
      }

      canvas {
        width: 320px;
        height: 320px;
      }

      figure {
        margin: 0;
        block-size: fit-content;
      }
    </style>
    <script>
      const compress = (positive) => positive / (1 + positive);

      class Complex {
        constructor(re, im) {
          this.re = re;
          this.im = im;
        }

        norm() {
          return Math.hypot(this.re, this.im);
        }

        angle() {
          return Math.atan2(this.im, this.re);
        }

        conj() {
          return new Complex(this.re, -this.im);
        }

        recip() {
          const under = this.norm();
          return new Complex(this.re / under, this.im / under);
        }

        exp() {
          const r = Math.exp(this.re);
          return new Complex(r * Math.cos(this.im), r * Math.sin(this.im));
        }

        log() {
          return new Complex(
            Math.log(this.re * this.re + this.im * this.im) / 2,
            Math.atan2(this.im, this.re),
          );
        }

        sin() {
          return new Complex(
            Math.sin(this.re) * Math.cosh(this.im),
            Math.cos(this.re) * Math.sinh(this.im),
          );
        }

        cos() {
          return new Complex(
            Math.cos(this.re) * Math.cosh(this.im),
            -Math.sin(this.re) * Math.sinh(this.im),
          );
        }

        tan() {
          const under = Math.cos(2 * this.re) + Math.cosh(2 * this.im);
          return new Complex(
            Math.sin(2 * this.re) / under,
            Math.sinh(2 * this.im) / under,
          );
        }

        sinh() {
          return new Complex(
            Math.sinh(this.re) * Math.cos(this.im),
            Math.cosh(this.re) * Math.sin(this.im),
          );
        }

        tanh() {
          const under = Math.cosh(2 * this.re) + Math.cos(2 * this.im);
          return new Complex(
            Math.sinh(2 * this.re) / under,
            Math.sin(2 * this.im) / under,
          );
        }
      }

      const drawCanvas = (canvas, func) => {
        const devicePixelRatio = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * devicePixelRatio;
        canvas.height = rect.height * devicePixelRatio;

        const context = canvas.getContext("2d");
        context.scale(devicePixelRatio, devicePixelRatio);

        const widthLogical = Math.PI * 4;
        const width = rect.width;
        const height = rect.height;
        const scale = widthLogical / width;
        const iToX = (i) => (i - width / 2) * scale;
        const jToY = (j) => (j - height / 2) * scale;

        for (let i = 0; i < width; i++)
          for (let j = 0; j < height; j++) {
            const x = iToX(i);
            const y = jToY(j);
            const complex = func(x, y);
            const norm = complex.norm();
            const angle = complex.angle();
            context.fillStyle =
              isNaN(norm) || isNaN(angle)
                ? "gray"
                : `hsl(${(angle * 180) / Math.PI}deg 100% ${compress(norm) * 100}%)`;
            context.fillRect(i, j, 1, 1);
          }
      };

      document.addEventListener("DOMContentLoaded", () => {
        for (const canvas of document.querySelectorAll("canvas"))
          drawCanvas(canvas, eval(canvas.dataset.func));
      });
    </script>
  </head>
  <body>
    <figure>
      <figcaption>identity</figcaption>
      <canvas data-func="(x, y) => new Complex(x, y)"></canvas>
    </figure>

    <figure>
      <figcaption>reciprocal</figcaption>
      <canvas data-func="(x, y) => new Complex(x, y).recip()"></canvas>
    </figure>

    <figure>
      <figcaption>exp</figcaption>
      <canvas data-func="(x, y) => new Complex(x, y).exp()"></canvas>
    </figure>

    <figure>
      <figcaption>log</figcaption>
      <canvas data-func="(x, y) => new Complex(x, y).log()"></canvas>
    </figure>

    <figure>
      <figcaption>sin</figcaption>
      <canvas data-func="(x, y) => new Complex(x, y).sin()"></canvas>
    </figure>

    <figure>
      <figcaption>tan</figcaption>
      <canvas data-func="(x, y) => new Complex(x, y).tan()"></canvas>
    </figure>

    <figure>
      <figcaption>sinh</figcaption>
      <canvas data-func="(x, y) => new Complex(x, y).sinh()"></canvas>
    </figure>

    <figure>
      <figcaption>tanh</figcaption>
      <canvas data-func="(x, y) => new Complex(x, y).tanh()"></canvas>
    </figure>
  </body>
</html>
